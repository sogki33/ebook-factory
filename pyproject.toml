[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ebook-factory"
version = "0.1.0"
description = "Markdown chapters + images -> print-quality illustrated PDF ebook, phone edition, free sampler and sales assets."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT (core); ebook-factory Pro license for ebookfactory/pro" }
dependencies = ["markdown>=3.5", "PyYAML>=6", "playwright>=1.40", "Pillow>=10", "pypdf>=4"]
keywords = ["ebook", "pdf", "markdown", "gumroad", "etsy", "self-publishing"]

[project.optional-dependencies]
qr = ["qrcode>=7"]
dev = ["pytest>=8", "qrcode>=7"]

[project.scripts]
ebookfactory = "ebookfactory.cli:main"

[tool.setuptools.packages.find]
include = ["ebookfactory*"]
